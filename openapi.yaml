  /v1/media/{mediaType}/{id}:
    get:
      tags: [Front End API]
      summary: Get enriched media details with community sentiment
      description: 'Returns a combined frontend-ready payload with TMDB metadata, aggregate sentiment, and recent community reviews. Use this for a detail page when you want both title data and app review context in one request. The `id` path parameter must be the TMDB media ID for the selected `mediaType`, not a local review ID or database row ID.'
      parameters:
        - in: path
          name: mediaType
          required: true
          schema:
            type: string
            enum: [movie, tv]
          description: 'The selected title type: `movie` or `tv`'
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: The TMDB media ID for the selected `mediaType` (`movie` or `tv`)
      responses:
        '200':
          description: Enriched media response with metadata, aggregate sentiment, and recent reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedMediaResponse'
        '400':
          description: The `mediaType` must be `movie` or `tv`, and the title ID must be a valid positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The media type must be either "movie" or "tv".'
        '404':
          description: TMDB could not find a title matching the provided media type and ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TMDBErrorResponse'
        default:
          description: TMDB returned an unexpected error while building the enriched media response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TMDBErrorResponse'
        '502':
          description: The API could not assemble the enriched media payload because an internal dependency or TMDB request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The API could not build the enriched media response because an upstream or database dependency failed.'

