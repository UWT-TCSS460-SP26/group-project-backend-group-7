  /v1/ratings/title/{title_id}:
    get:
      tags: [Ratings]
      summary: Get all ratings for a title
      description: Requires any authenticated user bearer token. Returns the rating records associated with one title. Use this when you need title-level rating data for analytics, moderation, or aggregate score calculations.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: title_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Ratings returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingListResponse'
        '400':
          description: The supplied title ID is invalid or is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The path parameter "title_id" must be a positive integer.'
        '404':
          description: No ratings currently exist for the requested title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No ratings were found for the requested title.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '500':
          description: The server could not retrieve ratings for the requested title because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not retrieve ratings for the requested title.'

  /v1/ratings/user/{authorId}/title/{title_id}:
    get:
      tags: [Ratings]
      summary: Get one user's rating for one title
      description: Requires any authenticated user bearer token. Returns a specific user's rating for one title. Use this to prefill a user's saved score on a detail page or confirm whether they have already rated it.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: authorId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: path
          name: title_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: User rating returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          description: The supplied author ID or title ID is invalid or is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The path parameter "authorId" must be a positive integer.'
        '404':
          description: No rating exists for the requested user and title combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No rating was found for the requested user and title combination.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '500':
          description: The server could not retrieve the requested rating because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not retrieve the requested rating.'

  /v1/reviews/{id}/upvote:
    post:
      tags: [Reviews]
      summary: Upvote a review
      description: Requires any authenticated user bearer token. Adds a positive vote to a review. Use this when a signed-in user wants to mark a review as helpful.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Review id
      responses:
        '200':
          description: Review upvoted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: The supplied review ID is invalid or is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The review ID in the path must be a positive integer.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '404':
          description: No review exists for the requested ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No review was found for the provided ID.'
        '500':
          description: The server could not register the upvote because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not register the upvote.'

  /v1/reviews/{id}/downvote:
    post:
      tags: [Reviews]
      summary: Downvote a review
      description: Requires any authenticated user bearer token. Adds a negative vote to a review. Use this when a signed-in user wants to signal that a review was not helpful.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Review id
      responses:
        '200':
          description: Review downvoted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: The supplied review ID is invalid or is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The review ID in the path must be a positive integer.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '404':
          description: No review exists for the requested ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No review was found for the provided ID.'
        '500':
          description: The server could not register the downvote because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not register the downvote.'

  /v1/reviews/{id}/remove-upvote:
    post:
      tags: [Reviews]
      summary: Remove an upvote
      description: Requires any authenticated user bearer token. Removes a previously counted upvote from a review. Use this when a signed-in user undoes a helpful vote.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Review id
      responses:
        '200':
          description: Upvote removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: The review ID is invalid, or the upvote count cannot be reduced below zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The upvote count is already zero, so there is no upvote to remove.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '404':
          description: No review exists for the requested ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No review was found for the provided ID.'
        '500':
          description: The server could not remove the upvote because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not remove the upvote.'

  /v1/ratings/user/{authorId}:
    get:
      tags: [Ratings]
      summary: Get a paginated list of ratings by user
      description: Requires any authenticated user bearer token. Returns a paginated list of ratings created by one user. Use this for profile pages, history views, or account activity screens.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: authorId
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: User ratings returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRatingListResponse'
        '400':
          description: The supplied author ID or page number is invalid for this ratings query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The query parameter "page" must be a positive integer.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '500':
          description: The server could not retrieve the user's ratings because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not retrieve ratings for the requested user.'

  /v1/issues:
    get:
      tags: [Issues]
      summary: Get all issues (admin only)
      description: Requires an admin bearer token. Returns all issue reports, optionally filtered by priority. Use this for admin dashboards, moderation views, or support triage workflows.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: priority
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 2
          description: Optional issue priority filter. `0` = 0-24 hr, `1` = 24-48 hr, `2` = 48+ hr.
      responses:
        '200':
          description: Issue list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueWithAuthor'
        '400':
          description: The issue query parameters contain invalid values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The issue query parameters are missing required fields or contain invalid values.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '403':
          description: The authenticated user is not allowed to access the issue list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The authenticated user does not have permission to access this resource.'
        '500':
          description: The server could not retrieve the issue list because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not retrieve the issue list.'
    post:
      tags: [Issues]
      summary: Submit a bug report
      description: Public endpoint. Creates a bug report without requiring authentication. Use this when the frontend needs to send support issues, broken behavior reports, or feedback for follow-up with as little friction as possible.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: Bug report submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          description: The bug report payload is missing required fields or contains invalid values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The bug report payload is missing required fields or contains invalid values.'
        '500':
          description: The server could not submit the bug report because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not submit the bug report.'

  /v1/issues/{id}:
    patch:
      tags: [Issues]
      summary: Update an issue (admin only)
      description: Requires an admin bearer token. Allows administrators to update an existing bug report for triage or moderation purposes. Use this when an admin needs to correct report details, adjust triage priority, or maintain the issue queue.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Issue id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequest'
      responses:
        '200':
          description: Issue updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          description: The issue ID is invalid, or the update payload contains invalid values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The issue update payload contains invalid values.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '403':
          description: The authenticated user is not allowed to update this issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The authenticated user does not have permission to access this resource.'
        '404':
          description: No issue exists for the requested ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No issue was found for the provided ID.'
        '500':
          description: The server could not update the issue because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not update the issue.'

    delete:
      tags: [Issues]
      summary: Delete an issue (admin only)
      description: Requires an admin bearer token. Allows administrators to remove a bug report from the issue queue. Use this for moderation cleanup, spam removal, or clearing reports that should no longer remain in the tracker.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Issue id
      responses:
        '200':
          description: Issue deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          description: The supplied issue ID is invalid or is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The issue ID in the path must be a positive integer.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '403':
          description: The authenticated user is not allowed to delete this issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The authenticated user does not have permission to access this resource.'
        '404':
          description: No issue exists for the requested ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No issue was found for the provided ID.'
        '500':
          description: The server could not delete the issue because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not delete the issue.'

  /v1/issues/{id}/status:
    patch:
      tags: [Issues]
      summary: Update the status of a bug report (admin only)
      description: Requires an admin bearer token. Allows administrators to change the progress of a bug report. Use this during triage to move an issue through states such as unsolved, in progress, and fixed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Issue ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [UNSOLVED, IN_PROGRESS, FIXED]
                  example: IN_PROGRESS
      responses:
        '200':
          description: Issue status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          description: The supplied issue ID is invalid, or the status payload contains invalid values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The issue status update payload contains invalid values.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '403':
          description: The authenticated user is not allowed to update issue status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The authenticated user does not have permission to access this resource.'
        '404':
          description: No issue exists for the requested ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No issue was found for the provided ID.'
        '500':
          description: The server could not update the issue status because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not update the issue status.'

  /v1/reviews/{id}/remove-downvote:
    post:
      tags: [Reviews]
      summary: Remove a downvote
      description: Removes a previously counted downvote from a review. Use this when a signed-in user undoes a not-helpful vote.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Review id
      responses:
        '200':
          description: Downvote removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: The review ID is invalid, or the downvote count cannot be reduced below zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The downvote count is already zero, so there is no downvote to remove.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '404':
          description: No review exists for the requested ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No review was found for the provided ID.'
        '500':
          description: The server could not remove the downvote because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not remove the downvote.'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token issued by the configured OAuth2/Auth0 issuer and sent as `Authorization: Bearer <token>`. Endpoints marked admin-only require a token belonging to a user with role `1`; other protected endpoints accept any authenticated user token.'

  responses:
    BearerTokenUnauthorized:
      description: The request could not be authenticated because the bearer token was missing, expired, or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingToken:
              summary: Missing bearer token
              value:
                error: 'The bearer token is missing.'
            expiredToken:
              summary: Expired bearer token
              value:
                error: 'The bearer token has expired.'
            invalidToken:
              summary: Invalid bearer token
              value:
                error: 'The bearer token is invalid.'

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        subjectId:
          type: string
          example: auth0|123
        username:
          type: string
          example: stardust42
        email:
          type: string
          example: stardust42@dev.local
        display_name:
          type: string
          nullable: true
          example: Stardust
        role:
          type: integer
          example: 2
          description: 1 = admin, 2 = user

    CreateUserRequest:
      type: object
      required: [username, email]
      properties:
        username:
          type: string
          example: stardust42
        email:
          type: string
          example: stardust42@dev.local
        display_name:
          type: string
          nullable: true
          example: Stardust

    UpdateUserRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          example: My New Name

    PaginatedUsersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3
    MovieDetailsResponse:
      type: object
      properties:
        id:
          type: integer
          example: 550
        title:
          type: string
          example: 'Fight Club'
        genre:
          type: string
          example: 'Drama'
        year:
          type: string
          example: '1999'
        summary:
          type: string
          example: 'A ticking-time-bomb insomniac and a slippery soap salesman...'
        poster_url:
          type: string
          nullable: true
          example: 'https://image.tmdb.org/t/p/w500/pB8BM79JsS0Zv9Uv00pYI0mhaZ5.jpg'

    TVDetailsResponse:
      type: object
      properties:
        id:
          type: integer
          example: 246
        title:
          type: string
          example: 'Avatar: The Last Airbender'
        genre:
          type: string
          example: 'Action & Adventure, Animation, Kids'
        year:
          type: string
          example: '2005'
        episodes:
          type: integer
          example: 61
        seasons:
          type: integer
          example: 3
        summary:
          type: string
          example: 'In a war-torn world of elemental magic, a young boy reawakens to undertake a dangerous mystic quest to fulfill his destiny as the Avatar, and bring peace to the world.'
        poster_url:
          type: string
          nullable: true
          example: 'https://image.tmdb.org/t/p/w500/cZ0d3rtvX5s1bUu3Wej2p3m2g2Y.jpg'

    EnrichedMediaMetadata:
      type: object
      properties:
        id:
          type: integer
          example: 550
        title:
          type: string
          example: Fight Club
        genre:
          type: string
          example: Drama
        year:
          type: string
          example: '1999'
        summary:
          type: string
          example: A ticking-time-bomb insomniac and a slippery soap salesman...
        poster_url:
          type: string
          nullable: true
          example: https://image.tmdb.org/t/p/w500/pB8BM79JsS0Zv9Uv00pYI0mhaZ5.jpg
        episodes:
          type: integer
          nullable: true
          example: 61
        seasons:
          type: integer
          nullable: true
          example: 3

    CommunityAggregate:
      type: object
      properties:
        averageRating:
          type: number
          nullable: true
          example: 4.3
        ratingCount:
          type: integer
          example: 17
        reviewCount:
          type: integer
          example: 6

    ReviewAuthorPreview:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          example: 3
        username:
          type: string
          example: kassie
        display_name:
          type: string
          nullable: true
          example: Kassie

    ReviewPreview:
      type: object
      properties:
        id:
          type: integer
          example: 12
        authorId:
          type: integer
          nullable: true
          example: 3
        header:
          type: string
          nullable: true
          example: Worth it
        content:
          type: string
          nullable: true
          example: Really strong performances and a memorable ending.
        upvotes:
          type: integer
          example: 4
        downvotes:
          type: integer
          example: 0
        createdAt:
          type: string
          format: date-time
          example: '2026-05-01T00:00:00.000Z'
        author:
          $ref: '#/components/schemas/ReviewAuthorPreview'

    EnrichedMediaResponse:
      type: object
      properties:
        mediaType:
          type: string
          enum: [movie, tv]
          example: movie
        metadata:
          $ref: '#/components/schemas/EnrichedMediaMetadata'
        community:
          $ref: '#/components/schemas/CommunityAggregate'
        recentReviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewPreview'

    TMDBErrorResponse:
      type: object
      description: Error returned when TMDB rejects or cannot fulfill an upstream media request.
      properties:
        status_message:
          type: string
          description: Human-readable message returned by TMDB.
          example: 'The resource you requested could not be found.'

    TVSearchResponse:
      type: object
      properties:
        page:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 1
        totalResults:
          type: integer
          example: 10
        results:
          type: array
          items:
            $ref: '#/components/schemas/TVSearchResult'

    TVSearchResult:
      type: object
      properties:
        id:
          type: integer
          example: 1396
        name:
          type: string
          example: Breaking Bad
        originalName:
          type: string
          example: Breaking Bad
        overview:
          type: string
          example: A chemistry teacher starts a new life.
        firstAirDate:
          type: string
          example: '2008-01-20'
        genreIds:
          type: array
          items:
            type: integer
          example: [18, 80]
        popularity:
          type: number
          example: 100.5
        voteAverage:
          type: number
          example: 8.9
        voteCount:
          type: integer
          example: 1000
        originalLanguage:
          type: string
          example: en
        posterPath:
          type: string
          nullable: true
          example: /poster.jpg
        posterUrl:
          type: string
          nullable: true
          example: https://image.tmdb.org/t/p/w500/poster.jpg
        backdropPath:
          type: string
          nullable: true
          example: /backdrop.jpg
        backdropUrl:
          type: string
