  /v1/ratings/{title_id}:
    post:
      tags: [Ratings]
      summary: Create or replace the authenticated user's rating for a title
      description: Requires any authenticated user bearer token. Creates a rating for the signed-in user, or replaces their existing rating for the same title. Use this when a user submits a star score from a detail page or rating control.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: title_id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingWriteRequest'
      responses:
        '201':
          description: Rating created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '200':
          description: Existing rating updated instead of created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          description: The title ID or rating payload is invalid, missing required fields, or outside the accepted value range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The request body field "rating" must be an integer.'
        '500':
          description: The server could not save the rating because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not create the rating because of an unexpected error.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
    patch:
      tags: [Ratings]
      summary: Update the authenticated user's rating for a title
      description: Requires any authenticated user bearer token. Updates an existing rating for the signed-in user and title. Use this when a user changes a score they have already submitted.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: title_id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  maximum: 5
                  description: Ratings above `5` are stored as `5`.
                  example: 5
      responses:
        '200':
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          description: The title ID or updated rating payload is invalid, missing required fields, or outside the accepted value range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The request body field "rating" must be an integer.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '404':
          description: No existing rating was found for the authenticated user and requested title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No existing rating was found for the authenticated user and requested title.'
        '500':
          description: The server could not update the rating because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not update the rating.'
    delete:
      tags: [Ratings]
      summary: Delete the authenticated user's rating for a title
      description: Requires any authenticated user bearer token. Removes the signed-in user's rating for a title. Use this when a user clears or undoes a previously submitted rating.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: title_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Rating deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          description: The supplied title ID is invalid or is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The path parameter "title_id" must be a positive integer.'
        '401':
          $ref: '#/components/responses/BearerTokenUnauthorized'
        '404':
          description: No existing rating was found for the authenticated user and requested title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'No existing rating was found for the authenticated user and requested title.'
        '500':
          description: The server could not delete the rating because of an unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'The server could not delete the rating.'

